# compose.yaml
services:
  pathfinder:
    build:
      context: .
      dockerfile: Dockerfile.pathfinder
    environment:
      NODE_ENV: production
      SCIENCE_RAIL_URL: http://science:8000
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      science:
        condition: service_healthy
    volumes:
      - pathfinder-ledger:/app/data
      - compute-artifacts:/app/artifacts

  science:
    build:
      context: .
      dockerfile: Dockerfile.science
    expose:
      - "8000"
    volumes:
      - compute-artifacts:/science/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.science
    profiles: ["lab"]
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/science/notebooks
      - compute-artifacts:/science/artifacts

volumes:
  pathfinder-ledger:
  compute-artifacts:
